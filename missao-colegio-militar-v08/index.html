<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>Missão Colégio Militar v0.8</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f7fb;overflow:hidden}#app{border:0;width:100%;height:100%;display:block;background:#f4f7fb}.err{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;max-width:680px;margin:12vh auto;background:#fff;padding:24px;border-radius:18px;color:#172033}
</style>
</head>
<body>
<iframe id="app" src="../missao-colegio-militar-v07/index.html?v08base=2" title="Missão Colégio Militar"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  frame.addEventListener('load',function(){
    try{
      const d=frame.contentDocument;
      if(!d)return;
      if(d.getElementById('v08-real-bank'))return;
      const s=d.createElement('script');
      s.id='v08-real-bank';
      s.src='../missao-colegio-militar-v08/real-questions.js?v=3';
      s.onload=function(){
        try{
          d.title='Missão Colégio Militar v0.8';
          const hero=d.querySelector('.hero');
          const tag=d.querySelector('.hero .tag');
          if(tag)tag.textContent='PLATAFORMA DE PREPARAÇÃO • v0.8';
          if(hero&&!d.getElementById('realBankOk')){
            const b=d.createElement('div');
            b.id='realBankOk';
            b.textContent='✓ Banco real carregado • questões de provas anteriores';
            b.style.cssText='display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:#ecfdf3;color:#166534;font-size:12px;font-weight:800';
            hero.appendChild(b);
          }
        }catch(e){}
      };
      s.onerror=function(){
        const hero=d.querySelector('.hero');
        if(hero){const b=d.createElement('div');b.textContent='⚠ Falha ao carregar banco de questões reais';b.style.cssText='margin-top:10px;padding:8px;background:#fff1f1;color:#9b1c1c;border-radius:10px;font-weight:700';hero.appendChild(b)}
      };
      d.body.appendChild(s);
    }catch(e){
      document.body.innerHTML='<div class="err"><h2>Não foi possível abrir a plataforma.</h2><p>Feche esta aba e abra novamente. Erro: '+String(e)+'</p></div>';
    }
  });
})();
</script>
</body>
</html>
