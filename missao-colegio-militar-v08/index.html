<script>
(function(){
  const frame=document.getElementById('app');
  frame.addEventListener('load',function(){
    try{
      const d=frame.contentDocument;
      if(!d)return;
      const old=d.getElementById('v08-real-bank');
      if(old)return;
      const s=d.createElement('script');
      s.id='v08-real-bank';
      s.src='../missao-colegio-militar-v08/real-questions.js?v=2';
      s.onload=function(){
        try{
          d.title='Missão Colégio Militar v0.8';
          const hero=d.querySelector('.hero .tag');
          if(hero)hero.textContent='PLATAFORMA DE PREPARAÇÃO • v0.8';
        }catch(e){}
      };
      s.onerror=function(){console.error('Falha ao carregar banco real v0.8');};
      d.body.appendChild(s);
    }catch(e){
      document.body.innerHTML='<div class="err"><h2>Não foi possível abrir a plataforma.</h2><p>Feche esta aba e abra novamente. Erro: '+String(e)+'</p></div>';
    }
  });
})();
</script>
