<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><title>Missão Colégio Militar v0.9</title><style>:root{--bg:#f4f7fb;--ink:#172033;--mut:#667085;--nav:#17365d;--gold:#b88a2b;--line:#e3e8ef;--ok:#166534;--bad:#9b1c1c}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}button,input{font:inherit}.w{max-width:1120px;margin:auto;padding:14px}.hero{background:linear-gradient(120deg,#132b49,#1d4b7d);color:#fff;padding:22px;border-radius:22px;margin-bottom:14px}.hero h1{margin:4px 0;font-size:clamp(27px,6vw,43px)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;background:var(--gold);color:#fff}.btn2{background:#fff;color:var(--nav);border:1px solid var(--line)}.hide{display:none!important}.card,.child{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.child{margin:14px 0}.auth{max-width:760px;margin:24px auto}.field{display:grid;gap:5px;margin:10px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:11px}.tag,.pill{display:inline-block;background:#eef3f8;color:var(--nav);padding:6px 9px;border-radius:99px;font-size:12px;font-weight:900}.mut{color:var(--mut)}.ok,.bad,.note,.suggest{padding:14px;border-radius:12px;margin:12px 0}.ok{background:#ecfdf3;color:var(--ok)}.bad{background:#fff1f1;color:var(--bad)}.note{background:#fff8e8;color:#73510f}.suggest{background:#eef5ff;color:#17365d;border-left:4px solid #17365d}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.c3{grid-column:span 3}.c6{grid-column:span 6}.c12{grid-column:span 12}.metric{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fafbfd}.metric b{display:block;font-size:24px}.meter{height:10px;background:#e8ecf2;border-radius:99px;overflow:hidden;margin-top:7px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#17365d,#b88a2b)}.topic,.recent{padding:9px 0;border-bottom:1px solid var(--line)}.topic{display:flex;justify-content:space-between;gap:10px}.topic:last-child,.recent:last-child{border-bottom:0}.statusok{color:var(--ok);font-weight:900}.statusbad{color:var(--bad);font-weight:900}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}@media(max-width:780px){.c3,.c6{grid-column:span 12}}</style></head><body><main class="w"><section class="hero"><span class="tag">PLATAFORMA DE PREPARAÇÃO • v0.9</span><h1>🎖️ Missão Colégio Militar</h1><p>Painel pedagógico dos responsáveis.</p><div class="row"><button id="studentBtn" class="btn btn2">🧒 Ambiente do aluno</button><button id="adminBtn" class="btn btn2">⚙️ Administração completa</button><button id="logoutBtn" class="btn btn2 hide">Sair</button></div></section><section id="loginView" class="auth"><div class="card"><span class="tag">RESPONSÁVEIS</span><h2>Entrar no painel</h2><p class="mut">Use o mesmo login e senha já cadastrados.</p><div class="field"><label>Login</label><input id="loginUser" autocapitalize="none"></div><div class="field"><label>Senha</label><input id="loginPass" type="password"></div><div id="msg"></div><button id="loginBtn" class="btn" style="width:100%">Entrar</button></div></section><section id="parentView" class="hide"><div class="card"><span class="tag">ACOMPANHAMENTO PEDAGÓGICO</span><h2 id="hello"></h2><p class="mut">Acertos, erros, matérias, assuntos, tempo e sugestões por filho.</p></div><div id="children"></div></section></main><script>const STORE='mcmV06',$=id=>document.getElementById(id);let db={family:null};try{db=JSON.parse(localStorage.getItem(STORE))||db}catch(e){}const norm=s=>(s||'').trim().toLowerCase(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function fmt(s){if(s==null)return'—';s=Math.round(s);let m=Math.floor(s/60),r=s%60;return(m?m+'m ':'')+r+'s'}function stats(c){const a=c.answers||[],n=a.length,o=a.filter(x=>x.ok).length,t=a.reduce((z,x)=>z+(x.sec||0),0);return{n,o,w:n-o,p:n?Math.round(o*100/n):null,av:n?Math.round(t/n):null}}function group(c,key){const m={};(c.answers||[]).forEach(a=>{const k=key(a);if(!k)return;if(!m[k])m[k]={n:0,o:0,w:0};m[k].n++;a.ok?m[k].o++:m[k].w++});return Object.entries(m).map(([name,v])=>({name,...v,p:v.n?Math.round(v.o*100/v.n):0}))}function analyze(c){const s=stats(c),sub=group(c,a=>a.s),topics=group(c,a=>a.t),weak=[...topics].sort((a,b)=>a.p-b.p||b.n-a.n).slice(0,4),strong=[...topics].sort((a,b)=>b.p-a.p||b.n-a.n).slice(0,4),errors=(c.answers||[]).filter(x=>!x.ok).slice(-6).reverse(),recent=(c.answers||[]).slice(-10).reverse(),sg=[];if(!c.diagnostic?.completed)sg.push('Concluir o diagnóstico antes do treino regular.');if(weak.length){sg.push('Priorizar '+weak.slice(0,2).map(x=>x.name).join(' e ')+' nas próximas sessões.');if(weak[0].p<50)sg.push('Revisar a teoria de '+weak[0].name+' e depois fazer 5 questões de reforço.')}const ma=sub.find(x=>x.name==='Matemática'),po=sub.find(x=>x.name==='Português');if(ma&&po&&Math.abs(ma.p-po.p)>=15)sg.push('Há diferença importante entre Matemática e Português; aumentar o tempo na matéria com menor desempenho.');if(s.av&&s.av>120)sg.push('Tempo médio acima de 2 minutos: trabalhar leitura do enunciado e estratégia de resolução.');if(s.p!=null&&s.p>=80)sg.push('Aproveitamento alto: aumentar gradualmente a dificuldade e manter revisão dos erros.');if(!sg.length)sg.push('Ainda há poucos dados; manter sessões regulares para formar um diagnóstico mais confiável.');return{s,sub,weak,strong,errors,recent,sg}}function meter(x){return`<div class=metric><span class=mut>${esc(x.name)}</span><b>${x.p}%</b><div class=mut>${x.o} acertos • ${x.w} erros • ${x.n} questões</div><div class=meter><i style="width:${Math.min(100,Math.max(0,x.p))}%"></i></div></div>`}function renderChild(c){const A=analyze(c),d=c.diagnostic||{};return`<div class=child><div class=top><div><b style="font-size:22px">${esc(c.name)}</b><div class=mut>Login: ${esc(c.login)}</div></div><span class=pill>${d.completed?d.level+' • diagnóstico '+d.score+'%':'Diagnóstico pendente'}</span></div><div class=grid style="margin-top:14px"><div class="metric c3"><span class=mut>Total</span><b>${A.s.n}</b><div class=mut>questões</div></div><div class="metric c3"><span class=mut>Acertos</span><b>${A.s.o}</b><div class=mut>${A.s.p==null?'—':A.s.p+'%'} geral</div></div><div class="metric c3"><span class=mut>Erros</span><b>${A.s.w}</b><div class=mut>para revisar</div></div><div class="metric c3"><span class=mut>Tempo médio</span><b>${fmt(A.s.av)}</b><div class=mut>por questão</div></div></div><h3>Desempenho por matéria</h3><div class=grid>${A.sub.length?A.sub.map(x=>`<div class=c6>${meter(x)}</div>`).join(''):'<div class="mut c12">Sem respostas ainda.</div>'}</div><div class=grid style="margin-top:14px"><div class="card c6" style="padding:14px"><h3 style="margin-top:0">⚠️ Mais dificuldade</h3>${A.weak.length?A.weak.map(x=>`<div class=topic><span>${esc(x.name)}</span><b>${x.p}% • ${x.w} erros</b></div>`).join(''):'<div class=mut>Sem dados suficientes.</div>'}</div><div class="card c6" style="padding:14px"><h3 style="margin-top:0">✅ Pontos fortes</h3>${A.strong.length?A.strong.map(x=>`<div class=topic><span>${esc(x.name)}</span><b>${x.p}% • ${x.o} acertos</b></div>`).join(''):'<div class=mut>Sem dados suficientes.</div>'}</div></div><div class=suggest><b>💡 Sugestões</b><ul>${A.sg.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class=grid><div class="card c6" style="padding:14px"><h3 style="margin-top:0">❌ Últimos erros</h3>${A.errors.length?A.errors.map(a=>`<div class=recent><b>${esc(a.s||'')} • ${esc(a.t||'')}</b><div class=mut>${esc(a.qtext||('Questão '+(a.qid??'')))}</div></div>`).join(''):'<div class=mut>Nenhum erro registrado.</div>'}</div><div class="card c6" style="padding:14px"><h3 style="margin-top:0">📝 Últimas respostas</h3>${A.recent.length?A.recent.map(a=>`<div class=recent><div class=${a.ok?'statusok':'statusbad'}>${a.ok?'✓ Acertou':'✗ Errou'} • ${esc(a.s||'')} • ${esc(a.t||'')}</div><div class=mut>${esc(a.qtext||('Questão '+(a.qid??'')))}</div></div>`).join(''):'<div class=mut>Nenhuma resposta registrada.</div>'}</div></div>${d.completed&&d.subject?`<div class=note><b>Diagnóstico inicial:</b> Matemática ${d.subject['Matemática']??'—'}% • Português ${d.subject['Português']??'—'}% • nível ${esc(d.level||'—')}.</div>`:''}</div>`}function render(){ $('hello').textContent='Olá, '+db.family.parent.name; $('children').innerHTML=(db.family.children||[]).map(renderChild).join('')||'<div class=note>Nenhum filho cadastrado.</div>'}$('loginBtn').onclick=async()=>{if(!db.family){$('msg').innerHTML='<div class=bad>Não há cadastro neste navegador. Use a Administração completa para criar a família.</div>';return}const u=norm($('loginUser').value),p=await hash($('loginPass').value);if(u!==db.family.parent.login||p!==db.family.parent.passHash){$('msg').innerHTML='<div class=bad>Login ou senha inválidos.</div>';return}$('loginView').classList.add('hide');$('parentView').classList.remove('hide');$('logoutBtn').classList.remove('hide');render()};$('logoutBtn').onclick=()=>{$('parentView').classList.add('hide');$('loginView').classList.remove('hide');$('logoutBtn').classList.add('hide');$('loginPass').value=''};$('studentBtn').onclick=()=>location.href='../missao-colegio-militar-v08/?from=v09';$('adminBtn').onclick=()=>location.href='../missao-colegio-militar-v08/?admin=1';</script></body></html>
