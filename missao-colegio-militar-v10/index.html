<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><title>Missão Colégio Militar v0.10</title><style>:root{--bg:#f4f7fb;--ink:#172033;--mut:#667085;--nav:#17365d;--gold:#c69223;--line:#dfe5ee;--ok:#166534;--bad:#b42318;--blue:#eef5ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}button,input{font:inherit}.w{max-width:1120px;margin:auto;padding:14px}.hero{background:linear-gradient(120deg,#17365d,#24578d);color:#fff;padding:22px;border-radius:22px}.hero h1{margin:4px 0;font-size:clamp(28px,6vw,44px)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:850;cursor:pointer;background:var(--gold);color:#fff}.btn2{background:#fff;color:var(--nav);border:1px solid var(--line)}.danger{background:#b52222;color:#fff}.hide{display:none!important}.card,.child{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.auth{max-width:760px;margin:24px auto}.field{display:grid;gap:5px;margin:10px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:11px}.tag,.pill{display:inline-block;background:#edf3f9;color:var(--nav);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}.mut{color:var(--mut)}.ok,.bad,.note,.suggest{padding:13px;border-radius:12px;margin:10px 0}.ok{background:#ecfdf3;color:var(--ok)}.bad{background:#fff1f1;color:var(--bad)}.note{background:#fff8e8;color:#71520e}.suggest{background:var(--blue);border-left:4px solid var(--nav);color:#17365d}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.metric{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fafbfd}.metric span{font-size:12px;color:var(--mut)}.metric b{display:block;font-size:22px;margin-top:2px}.subjectgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.subject{border:1px solid var(--line);border-radius:14px;padding:12px}.bar{height:9px;background:#e7ebf1;border-radius:999px;overflow:hidden;margin-top:7px}.bar i{height:100%;display:block;background:linear-gradient(90deg,#17365d,#c69223)}.details{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.details summary{cursor:pointer;font-weight:900;color:var(--nav);font-size:16px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.box{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.topic,.recent{padding:8px 0;border-bottom:1px solid var(--line)}.topic:last-child,.recent:last-child{border-bottom:0}.topic{display:flex;justify-content:space-between;gap:8px}.good{color:var(--ok);font-weight:900}.weak{color:var(--bad);font-weight:900}.childtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.childname{font-size:22px;font-weight:900}.actions{margin-top:13px}.today{font-size:12px;color:var(--mut);margin-top:5px}@media(max-width:720px){.metrics{grid-template-columns:1fr 1fr}.subjectgrid,.twocol{grid-template-columns:1fr}.actions .btn{flex:1 1 auto}.child{padding:15px}}</style></head><body><main class="w"><section class="hero"><span class="tag">PLATAFORMA DE PREPARAÇÃO • v0.10</span><h1>🎖️ Missão Colégio Militar</h1><p>Administração e acompanhamento dos filhos.</p><div id="sessionInfo" class="row hide" style="margin-top:12px"><span id="sessionBadge" class="tag"></span><button id="studentBtn" class="btn btn2">🧒 Ambiente do aluno</button><button id="logoutBtn" class="btn btn2">Sair</button></div></section><section id="loginView" class="auth"><div class="card"><span class="tag">RESPONSÁVEL</span><h2>Entrar</h2><p class="mut">Use o mesmo login e senha já cadastrados.</p><div class="field"><label>Login</label><input id="loginUser" autocapitalize="none"></div><div class="field"><label>Senha</label><input id="loginPass" type="password"></div><div id="msg"></div><button id="loginBtn" class="btn" style="width:100%">Entrar</button></div></section><section id="parentView" class="hide"><div class="card"><span class="tag">RESPONSÁVEIS</span><h2 id="parentHello"></h2><button id="addChildBtn" class="btn">+ Adicionar filho</button></div><div class="card"><h2 style="margin-top:0">Filhos cadastrados</h2><div id="childrenList"></div></div></section></main><script>const STORE='mcmV06',$=id=>document.getElementById(id),REW=[{n:10,name:'Sorvete',emoji:'🍦'},{n:20,name:'Milk-shake',emoji:'🥤'},{n:30,name:'Prêmio surpresa',emoji:'🎁'}];let db={family:null};try{db=JSON.parse(localStorage.getItem(STORE))||db}catch(e){}const norm=s=>(s||'').trim().toLowerCase(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),day=()=>new Date().toLocaleDateString('en-CA');async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function save(){localStorage.setItem(STORE,JSON.stringify(db))}function fmt(s){if(s==null)return'—';s=Math.round(s);let m=Math.floor(s/60),r=s%60;return(m?m+'m ':'')+r+'s'}function freshChild(name,login,passHash){return{id:'c'+Date.now()+Math.random().toString(16).slice(2),name,login,passHash,diagnostic:{completed:false},answers:[],sessions:[],rewards:REW.map(x=>({...x}))}}function stats(c){const a=c.answers||[],n=a.length,o=a.filter(x=>x.ok).length,t=a.reduce((z,x)=>z+(x.sec||0),0);return{n,o,w:n-o,p:n?Math.round(o*100/n):null,av:n?Math.round(t/n):null,today:a.filter(x=>x.day===day()).length}}function group(c,key){const m={};(c.answers||[]).forEach(a=>{const k=key(a);if(!k)return;if(!m[k])m[k]={n:0,o:0,w:0};m[k].n++;a.ok?m[k].o++:m[k].w++});return Object.entries(m).map(([name,v])=>({name,...v,p:v.n?Math.round(v.o*100/v.n):0}))}function analyze(c){const s=stats(c),subs=group(c,a=>a.s),topics=group(c,a=>a.t),weak=[...topics].sort((a,b)=>a.p-b.p||b.n-a.n).slice(0,4),strong=[...topics].sort((a,b)=>b.p-a.p||b.n-a.n).slice(0,4),errors=(c.answers||[]).filter(a=>!a.ok).slice(-5).reverse(),suggest=[];if(!c.diagnostic?.completed)suggest.push('Concluir o diagnóstico inicial antes de avançar para o treino adaptativo.');if(weak.length){suggest.push('Priorizar '+weak.slice(0,2).map(x=>x.name).join(' e ')+' nas próximas sessões.');if(weak[0].p<50)suggest.push('Fazer uma revisão curta da teoria de '+weak[0].name+' e depois resolver 5 questões do mesmo assunto.')}const ma=subs.find(x=>x.name==='Matemática'),po=subs.find(x=>x.name==='Português');if(ma&&po&&Math.abs(ma.p-po.p)>=15){const low=ma.p<po.p?'Matemática':'Português';suggest.push('Dedicar um bloco extra a '+low+', pois há diferença relevante entre as duas matérias.')}if(s.av&&s.av>120)suggest.push('O tempo médio está acima de 2 minutos; trabalhar leitura do enunciado e estratégia de resolução.');if(s.p!=null&&s.p>=80)suggest.push('Aproveitamento alto: manter revisão dos erros e aumentar gradualmente a dificuldade.');if(!suggest.length)suggest.push('Continuar com sessões regulares para aumentar a confiança da análise.');return{s,subs,weak,strong,errors,suggest}}function subjectCard(x){return`<div class=subject><div class=childtop><b>${esc(x.name)}</b><b>${x.p}%</b></div><div class=mut>${x.o} acertos • ${x.w} erros • ${x.n} questões</div><div class=bar><i style="width:${Math.max(0,Math.min(100,x.p))}%"></i></div></div>`}function childCard(c){const A=analyze(c),d=c.diagnostic||{},ma=A.subs.find(x=>x.name==='Matemática'),po=A.subs.find(x=>x.name==='Português');return`<div class=child><div class=childtop><div><div class=childname>${esc(c.name)}</div><div class=mut>Login: <b>${esc(c.login)}</b></div></div><div><span class=pill>${d.completed?d.level+' • '+d.score+'%':'Diagnóstico pendente'}</span><span class=pill>${A.s.n} respostas</span></div></div><div class=metrics><div class=metric><span>Acertos</span><b>${A.s.o}</b><div class=mut>${A.s.p==null?'—':A.s.p+'%'} geral</div></div><div class=metric><span>Erros</span><b>${A.s.w}</b><div class=mut>para revisar</div></div><div class=metric><span>Tempo médio</span><b>${fmt(A.s.av)}</b><div class=mut>por questão</div></div><div class=metric><span>Hoje</span><b>${A.s.today}</b><div class=mut>questões</div></div></div><div class=subjectgrid style="margin-top:10px">${ma?subjectCard(ma):'<div class=subject><b>Matemática</b><div class=mut>Sem dados ainda.</div></div>'}${po?subjectCard(po):'<div class=subject><b>Português</b><div class=mut>Sem dados ainda.</div></div>'}</div><details class=details open><summary>📊 Desempenho e sugestões</summary><div class=twocol><div class=box><h3 style="margin-top:0">⚠️ Mais dificuldade</h3>${A.weak.length?A.weak.map(x=>`<div class=topic><span>${esc(x.name)}</span><b class=weak>${x.p}% • ${x.w} erros</b></div>`).join(''):'<div class=mut>Sem dados suficientes.</div>'}</div><div class=box><h3 style="margin-top:0">✅ Pontos fortes</h3>${A.strong.length?A.strong.map(x=>`<div class=topic><span>${esc(x.name)}</span><b class=good>${x.p}% • ${x.o} acertos</b></div>`).join(''):'<div class=mut>Sem dados suficientes.</div>'}</div></div><div class=suggest><b>💡 Sugestão para os responsáveis</b><ul>${A.suggest.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class=box><h3 style="margin-top:0">❌ Últimos erros</h3>${A.errors.length?A.errors.map(a=>`<div class=recent><b>${esc(a.s||'')} • ${esc(a.t||'')}</b><div class=mut>Questão ${esc(a.qid??'')} • ${a.ref?'prova anterior':'questão do banco'}</div></div>`).join(''):'<div class=mut>Não há erros registrados.</div>'}</div>${d.completed&&d.subject?`<div class=note><b>Diagnóstico inicial:</b> Matemática ${d.subject['Matemática']??'—'}% • Português ${d.subject['Português']??'—'}% • nível ${esc(d.level||'—')}.</div>`:''}</details><div class="row actions"><button class="btn btn2" onclick="changePass('${c.id}')">Alterar senha</button><button class="btn btn2" onclick="editRewards('${c.id}')">Premiações</button>${d.completed?`<button class="btn danger" onclick="resetDiag('${c.id}')">Resetar diagnóstico</button>`:''}</div></div>`}function render(){ $('parentHello').textContent='Olá, '+db.family.parent.name;$('childrenList').innerHTML=(db.family.children||[]).map(childCard).join('')||'<div class=note>Nenhum filho cadastrado.</div>'}window.changePass=async id=>{const c=db.family.children.find(x=>x.id===id),p=prompt('Nova senha para '+c.name+':')||'';if(p.length<4)return alert('Senha muito curta.');c.passHash=await hash(p);save();alert('Senha atualizada.')};window.editRewards=id=>{const c=db.family.children.find(x=>x.id===id);c.rewards=(c.rewards||REW.map(x=>({...x})));c.rewards.forEach((r,i)=>{const n=prompt('Meta '+(i+1)+' - quantidade de questões:',r.n),name=prompt('Prêmio da meta '+(i+1)+':',r.name);if(n)r.n=Math.max(1,parseInt(n)||r.n);if(name)r.name=name.trim()||r.name});c.rewards.sort((a,b)=>a.n-b.n);save();render()};window.resetDiag=id=>{const c=db.family.children.find(x=>x.id===id);if(!confirm('Resetar o diagnóstico de '+c.name+'? No próximo acesso o teste será obrigatório novamente.'))return;c.diagnostic={completed:false};c.answers=(c.answers||[]).filter(x=>x.mode!=='diagnostico');c.sessions=(c.sessions||[]).filter(x=>x.mode!=='diagnostico');save();render()};$('addChildBtn').onclick=async()=>{const n=(prompt('Nome do aluno:')||'').trim(),l=norm(prompt('Login do aluno:')||''),p=prompt('Senha do aluno (mínimo 4 caracteres):')||'';if(!n||!l||p.length<4)return;if(l===db.family.parent.login||db.family.children.some(x=>x.login===l))return alert('Login já em uso.');db.family.children.push(freshChild(n,l,await hash(p)));save();render()};$('loginBtn').onclick=async()=>{if(!db.family){$('msg').innerHTML='<div class=bad>Não há cadastro neste navegador. Abra a versão do aluno para criar a família primeiro.</div>';return}const u=norm($('loginUser').value),p=await hash($('loginPass').value);if(u!==db.family.parent.login||p!==db.family.parent.passHash){$('msg').innerHTML='<div class=bad>Login ou senha inválidos.</div>';return}$('loginView').classList.add('hide');$('parentView').classList.remove('hide');$('sessionInfo').classList.remove('hide');$('sessionBadge').textContent='RESPONSÁVEL • '+db.family.parent.name;render()};$('logoutBtn').onclick=()=>{$('parentView').classList.add('hide');$('sessionInfo').classList.add('hide');$('loginView').classList.remove('hide');$('loginPass').value=''};$('studentBtn').onclick=()=>location.href='../missao-colegio-militar-v08/?from=v10';</script></body></html>
